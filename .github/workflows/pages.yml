# Publishes the site/ folder to GitHub Pages on every push to main.
#
# What this workflow does NOT do: run the Python pipeline. That is deliberate.
# A full GBIF download takes an hour or two and hits a free public API
# thousands of times; doing it on every push would be rude to GBIF and slow
# for us, and it would mean the published site could change without anyone
# reviewing the change.
#
# So the data is refreshed by hand:
#
#   python pipeline/build.py        # on your laptop, reads GBIF
#   git add site/data/arrivals.json # commit the numbers you just looked at
#   git push                        # this workflow publishes them
#
# Turning Pages on, once, by hand: repository Settings -> Pages ->
# Source: "GitHub Actions". Until that is done this workflow fails at the
# Configure Pages step with "Get Pages site failed".
#
# This cannot be automated from here, and it was tried. configure-pages takes
# an `enablement: true` option, but creating a Pages site needs admin rights
# on the repository, and the token a workflow gets has `pages: write` for
# deploying to an existing site only. With enablement on, the run fails with
# "Create Pages site failed: Resource not accessible by integration", which
# is a more confusing way to say the same thing. It is one click, once.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing anything.
  workflow_dispatch:

# The permissions the official deploy action needs. `id-token` is for the
# OIDC handshake that proves to Pages this deployment came from this repo.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish rather than
# cancelling it: a half-finished deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package the site folder
        uses: actions/upload-pages-artifact@v3
        with:
          # Only site/ is published. The pipeline, the tests and the cached
          # GBIF responses are not part of the website.
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
